<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaker lanes</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --fg: #1d1d1b; --muted: #6b6a64; --line: #dedcd4;
    --accent: #2f5bd3; --lane: #efeee8; --play: #d23b2f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --panel: #1f1f1d; --fg: #ecebe6; --muted: #9b9a93; --line: #34332f;
      --accent: #7c9cff; --lane: #2a2a27; --play: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px;
         padding: 7px 12px; cursor: pointer; font: inherit; }
  .tab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .tab .done { color: var(--accent); margin-left: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .head h2 { font-size: 17px; margin: 0; }
  .clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  audio { width: 100%; margin: 12px 0 6px; }
  .lanes { width: 100%; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 640px; cursor: pointer; user-select: none; }
  .lane-label { font-size: 12px; fill: var(--muted); }
  .tick { font-size: 10px; fill: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .legend b { color: var(--fg); font-weight: 600; margin-right: 4px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 8px; vertical-align: -1px; }
  .note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  form { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 14px; }
  fieldset { border: 0; padding: 0; margin: 0; }
  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
  .opts { display: flex; gap: 8px; flex-wrap: wrap; }
  .opts label { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .opts input { margin-right: 6px; }
  .opts label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opts label:has(input:disabled) { opacity: .45; cursor: not-allowed; }
  input[type=number] { width: 90px; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
                       background: var(--panel); color: var(--fg); font: inherit; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button.save { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 18px;
                font: inherit; font-weight: 600; cursor: pointer; }
  button.save:disabled { opacity: .5; cursor: default; }
  .saved { color: var(--muted); font-size: 13px; }
  .missing { fill: var(--muted); font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<main>
  <h1>Who is speaking — local vs pyannote.ai</h1>
  <p class="sub">Five windows where the two diarizers disagreed most. Play, click either lane to jump there, and say which track matches what you hear.</p>
  <div class="tabs" id="tabs"></div>
  <div class="card" id="card">Loading…</div>
</main>
<script>
const base = location.pathname.replace(/\/$/, '');
const PAL = ['#2f7dd6','#e0823a','#3aa66b','#c2449b','#8b62d9','#c9a227','#23a7a7','#d2493b','#6b8e23','#a0522d'];
let S = null, cur = 0, audio = null, raf = null;

async function api(p, body) {
  const r = await fetch(base + p, body ? { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error('request failed');
  return r.json();
}
const mmss = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };

function tabs() {
  document.getElementById('tabs').innerHTML = S.windows.map((w, i) =>
    `<button class="tab ${i===cur?'on':''}" data-i="${i}">${w.label} · ${w.when}${w.answer?'<span class="done">✓</span>':''}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur = +b.dataset.i; render(); });
}

function speakers(segs) {
  const tot = {};
  for (const s of segs) tot[s.speaker] = (tot[s.speaker] || 0) + (s.end_ms - s.start_ms) / 1000;
  return Object.entries(tot).sort((a, b) => b[1] - a[1]);
}

function laneSVG(w) {
  const W = 1000, laneH = 34, top = 18, gap = 16, left = 92, right = 8;
  const H = top + laneH * 2 + gap + 22, dur = w.duration_s || 900;
  const x = t => left + (W - left - right) * (t / dur);
  let g = `<svg id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="speaker lanes">`;
  for (let m = 0; m <= Math.floor(dur / 60); m++) {
    const xx = x(m * 60);
    g += `<line x1="${xx}" y1="${top - 4}" x2="${xx}" y2="${top + laneH * 2 + gap}" stroke="var(--line)" stroke-width="1"/>`;
    if (m % 2 === 0) g += `<text class="tick" x="${xx}" y="${H - 6}" text-anchor="middle">${m}m</text>`;
  }
  const lanes = [['local', w.local], ['pyannote.ai', w.pyannote]];
  lanes.forEach(([name, segs], li) => {
    const y = top + li * (laneH + gap);
    g += `<text class="lane-label" x="0" y="${y + laneH/2 + 4}">${name}</text>`;
    g += `<rect x="${left}" y="${y}" width="${W - left - right}" height="${laneH}" rx="4" fill="var(--lane)"/>`;
    if (!segs) {
      g += `<text class="missing" x="${left + 10}" y="${y + laneH/2 + 4}">pyannote.ai segments not loaded yet — the bake-off kept only aggregate scores</text>`;
      return;
    }
    const order = speakers(segs).map(e => e[0]);
    for (const s of segs) {
      const c = PAL[order.indexOf(s.speaker) % PAL.length];
      const x0 = x(s.start_ms / 1000), x1 = Math.max(x(s.end_ms / 1000), x0 + 1);
      g += `<rect x="${x0}" y="${y + 3}" width="${x1 - x0}" height="${laneH - 6}" fill="${c}"/>`;
    }
  });
  g += `<line id="ph" x1="${left}" y1="${top - 6}" x2="${left}" y2="${top + laneH * 2 + gap + 2}" stroke="var(--play)" stroke-width="2"/>`;
  g += `</svg>`;
  return { svg: g, geom: { W, left, right, dur } };
}

function legend(name, segs) {
  if (!segs) return `<div><b>${name}</b> —</div>`;
  const e = speakers(segs);
  return `<div><b>${name}</b> ${e.length} speaker${e.length===1?'':'s'}:` + e.map(([k, v], i) =>
    `<span class="sw" style="background:${PAL[i % PAL.length]}"></span>${k} ${Math.round(v)}s`).join('') + `</div>`;
}

function render() {
  if (audio) { audio.pause(); cancelAnimationFrame(raf); }
  tabs();
  const w = S.windows[cur], a = w.answer || {};
  const { svg, geom } = laneSVG(w);
  const hasP = !!w.pyannote;
  document.getElementById('card').innerHTML = `
    <div class="head"><h2>${w.label} · ${w.when} IST</h2><span class="clock" id="clock">00:00 / ${mmss(w.duration_s)}</span></div>
    <audio id="au" controls preload="metadata" src="${base}/audio/${w.audio}"></audio>
    <div class="lanes">${svg}</div>
    <div class="legend">${legend('local', w.local)}${legend('pyannote.ai', w.pyannote)}</div>
    <p class="note">Colours are per lane: the same colour in both lanes does not mean the same person. Click anywhere on a lane to jump there. Space plays and pauses.</p>
    <form id="f">
      <fieldset><legend>Which track is closer to what you hear?</legend>
        <div class="opts">
          <label><input type="radio" name="closer" value="local" ${a.closer==='local'?'checked':''}>Local</label>
          <label><input type="radio" name="closer" value="pyannote" ${a.closer==='pyannote'?'checked':''} ${hasP?'':'disabled'}>pyannote.ai</label>
          <label><input type="radio" name="closer" value="both_wrong" ${a.closer==='both_wrong'?'checked':''}>Both wrong</label>
        </div>
      </fieldset>
      <div class="row"><label for="spk"><b>How many people actually speak?</b></label>
        <input id="spk" type="number" min="0" max="30" step="1" value="${Number.isInteger(a.speakers)?a.speakers:''}"></div>
      <div class="row"><button class="save" type="submit">Save</button>
        <span class="saved" id="saved">${w.answer ? 'Saved ' + w.answer.t.replace('T',' ').replace('Z',' UTC') : ''}</span></div>
    </form>`;
  audio = document.getElementById('au');
  const svgEl = document.getElementById('svg'), ph = document.getElementById('ph'), clock = document.getElementById('clock');
  const tick = () => {
    const t = audio.currentTime || 0, xx = geom.left + (geom.W - geom.left - geom.right) * (t / geom.dur);
    ph.setAttribute('x1', xx); ph.setAttribute('x2', xx); clock.textContent = mmss(t) + ' / ' + mmss(geom.dur);
    raf = requestAnimationFrame(tick);
  };
  audio.onplay = () => { cancelAnimationFrame(raf); tick(); };
  audio.onpause = () => cancelAnimationFrame(raf);
  audio.onseeked = () => { if (audio.paused) { cancelAnimationFrame(raf); tick(); cancelAnimationFrame(raf); } };
  svgEl.onclick = ev => {
    const r = svgEl.getBoundingClientRect(), vx = (ev.clientX - r.left) * (geom.W / r.width);
    const t = Math.min(geom.dur, Math.max(0, (vx - geom.left) / (geom.W - geom.left - geom.right) * geom.dur));
    audio.currentTime = t; audio.play().catch(() => {});
  };
  document.getElementById('f').onsubmit = async ev => {
    ev.preventDefault();
    const closer = (document.querySelector('input[name=closer]:checked') || {}).value;
    const spk = parseInt(document.getElementById('spk').value, 10);
    const out = document.getElementById('saved');
    if (!closer || !Number.isInteger(spk)) { out.textContent = 'Pick one option and enter a number.'; return; }
    try {
      await api('/api/answer', { n: w.n, closer, speakers: spk });
      S = await api('/api/state'); out.textContent = 'Saved.'; tabs();
    } catch (e) { out.textContent = 'Not saved — try again.'; }
  };
}

document.addEventListener('keydown', ev => {
  if (ev.code === 'Space' && audio && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
    ev.preventDefault(); audio.paused ? audio.play().catch(() => {}) : audio.pause();
  }
});
api('/api/state').then(s => { S = s; render(); }).catch(() => { document.getElementById('card').textContent = 'Could not load.'; });
</script>
</body>
</html>
