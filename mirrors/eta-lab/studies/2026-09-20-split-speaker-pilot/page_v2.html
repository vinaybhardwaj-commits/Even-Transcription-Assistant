<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Voice check</title>
<style>
  :root { --bg:#f6f5f1; --fg:#1d1d1b; --mute:#6b6a64; --card:#fff; --line:#dcdad2; --accent:#1f5f8b; --me:#1f7a4d; --not:#8a3b2f; --cant:#5b5a55; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --fg:#eeede8; --mute:#9d9b93; --card:#1f1f1d; --line:#38372f; --accent:#6db3e0; --me:#5fc891; --not:#e59a8c; --cant:#b0aea6; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  main { width:100%; max-width:560px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  h1 { font-size:22px; margin:0 0 8px; font-weight:600; }
  p { margin:8px 0 18px; color:var(--mute); }
  .count { font-size:15px; color:var(--mute); letter-spacing:.02em; margin-bottom:10px; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:26px; }
  .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .25s; }
  button { font:inherit; cursor:pointer; border-radius:12px; border:1.5px solid var(--line); background:var(--card); color:var(--fg); padding:16px 18px; }
  button:disabled { opacity:.4; cursor:default; }
  #play { width:100%; font-size:20px; padding:26px 18px; border-color:var(--accent); color:var(--accent); margin-bottom:22px; }
  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
  .row.two { grid-template-columns:1fr 1fr 1fr; }
  #me { border-color:var(--me); color:var(--me); } #not { border-color:var(--not); color:var(--not); } #cant { border-color:var(--cant); color:var(--cant); }
  .row button { font-size:19px; font-weight:600; padding:22px 8px; }
  .row button.chosen { background:currentColor; } .row button.chosen span { color:var(--card); }
  .hint { margin-top:20px; display:flex; justify-content:space-between; align-items:center; font-size:14px; color:var(--mute); }
  .link { background:none; border:none; padding:6px 2px; color:var(--mute); text-decoration:underline; font-size:14px; }
  .hidden { display:none; }
  .q button { width:100%; margin-top:10px; font-size:19px; text-align:left; }
</style>
</head>
<body>
<main><div class="card" id="root"></div></main>
<audio id="a" preload="auto"></audio>
<script>
const base = location.pathname.replace(/\/+$/, '');
const root = document.getElementById('root'), audio = document.getElementById('a');
let S = null, cur = null, playedEnough = false;

async function api(path, body) {
  const r = await fetch(base + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (!r.ok) throw new Error('request failed');
  return r.json();
}
const firstOpen = () => { const i = S.order.findIndex(id => !S.answers[id]); return i < 0 ? S.order.length : i; };

function render() {
  audio.pause();
  if (!S.ready) { root.innerHTML = '<h1>Voice check</h1><p>The clips are still being prepared. This page will start by itself when they are ready.</p>'; setTimeout(async () => { S = await api('/api/state'); render(); }, 8000); return; }
  if (S.clinician === null) return renderQuestion();
  if (cur === null) cur = firstOpen();
  if (cur >= S.order.length) return renderDone();
  renderClip();
}

function renderQuestion() {
  root.innerHTML = `<h1>Voice check</h1>
    <p>You will hear short clips recorded in this room. For each one, say whether the voice is Dr. Animesh. There are no wrong answers; “Can’t tell” is fine. One question first.</p>
    <div class="q"><p style="color:var(--fg);margin-bottom:4px"><b>Did anyone else consult in this room that day?</b></p>
      <button data-v="no">No, only Dr. Animesh</button><button data-v="yes">Yes, someone else did</button><button data-v="not_sure">Not sure</button></div>`;
  root.querySelectorAll('button').forEach(b => b.onclick = async () => { await api('/api/clinician', { answer: b.dataset.v }); S.clinician = b.dataset.v; cur = null; render(); });
}

function renderClip() {
  const id = S.order[cur], prev = S.answers[id] || null, n = S.order.length;
  playedEnough = false;
  root.innerHTML = `<div class="count">${cur + 1} of ${n}</div>
    <div class="bar"><i style="width:${Math.round(100 * Object.keys(S.answers).length / n)}%"></i></div>
    <button id="play">▶  Play</button>
    <div class="row">
      <button id="me" data-v="me" disabled><span>Dr. Animesh</span></button>
      <button id="not" data-v="not_me" disabled><span>Not him</span></button>
      <button id="cant" data-v="cant_tell" disabled><span>Can’t tell</span></button>
    </div>
    <div class="hint"><button class="link ${cur === 0 ? 'hidden' : ''}" id="back">← Back</button><span>Space plays · 1 · 2 · 3 answer</span></div>`;
  const play = document.getElementById('play');
  const btns = [...root.querySelectorAll('.row button')];
  const unlock = () => { if (playedEnough) return; playedEnough = true; btns.forEach(b => b.disabled = false); };
  if (prev) { unlock(); btns.forEach(b => b.classList.toggle('chosen', b.dataset.v === prev)); }
  audio.src = base + '/audio/' + id + '.wav';
  audio.ontimeupdate = () => { if (audio.currentTime >= 2) unlock(); };
  audio.onended = () => { unlock(); play.textContent = '↻  Play again'; };
  audio.onplay = () => { play.textContent = '❚❚  Pause'; };
  audio.onpause = () => { if (!audio.ended) play.textContent = '▶  Play'; };
  play.onclick = () => { audio.paused ? audio.play() : audio.pause(); };
  btns.forEach(b => b.onclick = async () => {
    btns.forEach(x => x.disabled = true);
    await api('/api/answer', { id, answer: b.dataset.v });
    S.answers[id] = b.dataset.v; cur += 1; render();
    if (cur < S.order.length) audio.play().catch(() => {});
  });
  const back = document.getElementById('back'); if (back) back.onclick = () => { cur -= 1; render(); };
  audio.play().catch(() => {});
}

function renderDone() {
  root.innerHTML = `<h1>That’s all of them.</h1><p>Thank you. Your answers are saved. You can close this page.</p>
    <button class="link" id="back">← Back to the last clip</button>`;
  document.getElementById('back').onclick = () => { cur = S.order.length - 1; render(); };
}

document.addEventListener('keydown', e => {
  if (!S || S.clinician === null || cur === null || cur >= S.order.length) return;
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('play').click(); }
  const map = { '1': 'me', '2': 'not', '3': 'cant' };
  if (map[e.key]) { const b = document.getElementById(map[e.key]); if (b && !b.disabled) b.click(); }
});

api('/api/state').then(s => { S = s; render(); }).catch(() => { root.innerHTML = '<h1>Voice check</h1><p>This page could not reach its server. Try again in a moment.</p>'; });
</script>
</body>
</html>
