[project]
name = "timbre-harness"
version = "0.1.0"
requires-python = ">=3.11"
description = "Offline test harness for Timbre voice-affect features. Not the live pipeline."
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "soundfile>=0.12",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pytest>=8",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "transformers>=4.44",
    "opensmile>=2.5",
    "huggingface_hub>=0.24",
    "safetensors>=0.4",
    "boto3>=1.34",
    "funasr>=1.1",
]

[tool.uv]
package = false

# Default the locked torch to the CPU wheel. A CUDA box can install the CUDA
# build itself; this harness must stay runnable without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
