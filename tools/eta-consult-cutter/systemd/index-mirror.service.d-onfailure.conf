# install as ~/.config/systemd/user/index-mirror.service.d/onfailure.conf (NOT installed by this repo; consult-lead installs it with the unit). Needs cutter-alert@.service installed too.
# A failed mirror raises an alert; it can never fail a cut (cutter-hourly.service has no link to this unit).
[Unit]
OnFailure=cutter-alert@%n.service
