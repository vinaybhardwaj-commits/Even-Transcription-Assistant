# Gitleaks config for this repo: the default ruleset plus ONE narrow allowance.
# tests/unit/fleet-jws-vector.test.ts holds three throwaway JWTs signed with a fixed-seed key (32 x 0x07) used as cross-language test vectors for the fleet
# protocol (docs/fleet/PROTOCOL.md). Current files carry an inline gitleaks:allow; the commit below is the one historical commit that added them before the
# annotation existed, and history cannot be rewritten on a shared branch. Nothing else is allowed.
[extend]
useDefault = true

[allowlist]
description = "made-up test strings, first commit that added each (history cannot be rewritten)"
commits = [
  "8f85e6bf9b1d757c88c84d70eb5b73ffb021e679", # fleet JWT test vectors (fixed-seed throwaway key)
  "61b686f5c43054df80e0119cffd2d684ccad155f", # fleet-h6-pg: a made-up "operator-picked" token string in a refusal test
]
