# protocol (docs/fleet/PROTOCOL.md). Current files carry an inline gitleaks:allow; the commit below is the one historical commit that added them before the
# annotation existed, and history cannot be rewritten on a shared branch. Nothing else is allowed.
[extend]
useDefault = true

[allowlist]
description = "fixed-seed test-vector JWTs, first commit only"
commits = ["8f85e6bf9b1d757c88c84d70eb5b73ffb021e679"]
