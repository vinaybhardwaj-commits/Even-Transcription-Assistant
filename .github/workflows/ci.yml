name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (npm install — repo has no lockfile; matches Vercel)
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest installed ephemerally — not a committed dep; same pattern as e2e's playwright)
        run: |
          npm i -D vitest@^2 --no-audit --no-fund
          # forks with a capped count: the threads pool hit "[vitest-worker]: Timeout calling onTaskUpdate" on loaded runners (PR 56, 59)
          npx vitest run --pool=forks --poolOptions.forks.maxForks=2

      - name: Silent-failure gate (no empty catch/.catch in critical paths; fails on any finding NOT in .github/check-silent-baseline.txt)
        run: |
          set +e
          out="$(npm run -s check:silent 2>&1)"; rc=$?
          echo "$out"
          [ $rc -eq 0 ] && exit 0
          echo "$out" | grep -q "^Found [0-9]* silent-failure" || { echo "::error::check:silent failed without a findings list"; exit 1; }
          CHECK_OUT="$out" python3 - <<'PYCHK'
          import os, re, sys
          from collections import Counter
          key = lambda path, text: f"{path}\t{text.strip()}"
          found = Counter()
          for l in os.environ["CHECK_OUT"].splitlines():
              m = re.match(r"^\s+(\S+?):(\d+)\s+(.*?)\s*$", l)
              if m: found[key(m.group(1), m.group(3))] += 1
          bp = ".github/check-silent-baseline.txt"
          if not os.path.exists(bp):
              print(f"::error::check:silent baseline missing ({bp}); gate with kit/gh-gate.sh, which overlays it"); sys.exit(1)
          base = Counter(l.rstrip("\n") for l in open(bp) if l.strip() and not l.startswith("#"))
          new = found - base
          for k in sorted(new): print(f"::error::NEW silent-failure handler (not in the accepted baseline): {k.replace(chr(9), '  ')}")
          for k in sorted(base - found): print(f"::notice::accepted finding no longer present (remove it from the baseline): {k.replace(chr(9), '  ')}")
          print(f"check:silent: {sum(found.values())} found, {sum(new.values())} new vs the accepted baseline")
          sys.exit(1 if new else 0)
          PYCHK
